<style>
:root{--y:#ffd23f;--r:#ff4d6d;--b:#3ec7ff;--g:#3ee07a;--bg:rgba(10,14,34,.55);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#141a3a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;touch-action:auto;user-select:text;-webkit-user-select:text}
.pill{background:var(--bg);border-radius:20px;padding:5px 11px;font-size:13px;white-space:nowrap}
.pill b{color:var(--y)}
.btn{background:linear-gradient(180deg,#ffe45c,#ffb703);color:#2a1a00;font-weight:900;border-radius:12px;padding:12px 18px;letter-spacing:.5px;box-shadow:0 4px 0 #b37400}
.btn.alt{background:linear-gradient(180deg,#5ad1ff,#2196f3);color:#fff;box-shadow:0 4px 0 #0d5aa7}
.btn.red{background:linear-gradient(180deg,#ff7a8a,#e5383b);color:#fff;box-shadow:0 4px 0 #8f1d1f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b37400}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a0a0c,#0c0c0c 70%);z-index:50;gap:14px}
#loading .logo{font-size:48px}
.logo{font-weight:1000;font-size:34px;letter-spacing:2px;font-style:italic;text-shadow:0 3px 0 #0b1030,0 0 24px rgba(62,199,255,.6)}
.logo span{color:var(--y)}
.logo.nk{font-style:normal;letter-spacing:0;display:flex;align-items:baseline;gap:2px;text-shadow:0 3px 0 #000,0 0 18px rgba(225,20,28,.45)}
.logo.nk b{color:#f2f2f2;font-weight:1000}.logo.nk i{color:#e1141c;font-weight:1000;font-style:normal}
.logo.nk em{font-style:normal;font-weight:800;font-size:.4em;letter-spacing:4px;color:#fff;margin-left:8px;text-shadow:0 2px 0 #000}
.ldi{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 30px rgba(225,20,28,.35)}
#rotate{position:fixed;inset:0;background:#141a3a;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#toast{position:fixed;top:22%;left:50%;transform:translate(-50%,-10px);background:rgba(10,14,34,.8);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:40;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{color:var(--y)}#toast.bad{color:#ff8fa3}#toast.warn{color:#7cc4ff;font-weight:700}
/* ---------- lobby ---------- */
#lobby{position:fixed;inset:0;z-index:10;pointer-events:none}
#lobby>*{pointer-events:auto}
.lgo{position:absolute;top:12px;left:calc(16px + var(--sl))}
.lgo .sub{font-size:12px;opacity:.85;margin-top:7px;letter-spacing:1px}
.lgo .logo.nk{line-height:1}
.lst{position:absolute;top:14px;right:calc(14px + var(--sr));display:flex;gap:6px;align-items:center}
.hb2{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px}
.lleft{position:absolute;left:calc(16px + var(--sl));top:90px;width:210px;display:flex;flex-direction:column;gap:6px}
.lright{position:absolute;right:calc(16px + var(--sr));top:70px;width:250px;display:flex;flex-direction:column;gap:6px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-top:4px;text-shadow:0 1px 2px #000}
#lName{background:var(--bg);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 10px;color:#fff;outline:none}
.chsel{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:6px}
.chsel div{flex:1;text-align:center;display:flex;flex-direction:column}
.chsel small{font-size:11px;opacity:.7}
.chsel button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);font-size:14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700}
.seg button.on{background:var(--y);color:#241600}
.btn.play{font-size:26px;padding:14px;margin-top:10px;font-style:italic}
.hint{font-size:11px;opacity:.8;text-align:center;text-shadow:0 1px 2px #000}
.squad{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.slot{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.slot.me{border:2px solid var(--y);justify-content:center;font-weight:800}
.slot .inv{font-size:11px;color:var(--b);font-weight:700}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .np,#cross,#scope,#hitm,#hurt,#flash,#comp,#feed,#zoneT,#planeT,#prog,.dmgdir{pointer-events:none}
#mini{position:absolute;top:8px;left:calc(8px + var(--sl));width:128px;height:128px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:#1e4f7a}
#zoneT{position:absolute;top:140px;left:calc(8px + var(--sl));font-size:11px;background:var(--bg);padding:3px 8px;border-radius:8px;max-width:220px}
#zoneT b{color:var(--y)}.red{color:#ff6b81;font-weight:800}
#comp{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:220px;height:30px;overflow:hidden;font-size:11px;mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
#comp span{position:absolute;top:2px;transform:translateX(-50%);opacity:.8}
#comp span.big{font-weight:900;opacity:1;color:var(--y);font-size:13px}
#comp b{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:10px;background:var(--bg);padding:0 4px;border-radius:4px}
#topR{position:absolute;top:9px;right:calc(144px + var(--sr));display:flex;gap:6px}
#feed{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;white-space:nowrap}
#feed div{background:var(--bg);padding:2px 8px;border-radius:6px}
#feed div.me{background:rgba(255,183,3,.35)}
#feed small{opacity:.7}
#hpbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:300px}
#hpB{height:9px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.4)}
#hpF{height:100%;background:#fff;transition:width .15s}#hpF.low{background:var(--r)}#hpF.knock{background:#ff8c42}
#boostB{height:3px;margin-top:2px}#boostF{height:100%;background:var(--y);border-radius:2px}
#armor{position:absolute;bottom:14px;left:0;transform:translateX(-110%);display:flex;gap:4px;font-size:11px}
#armor span{background:var(--bg);padding:1px 5px;border-radius:5px}
.lv1{color:#f0d9a0}.lv2{color:#7cc4ff}.lv3{color:#d5b8ff}
#wslots{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.ws{width:88px;height:44px;background:var(--bg);border-radius:9px;border:2px solid transparent;padding:3px 7px;font-size:11px;display:flex;flex-direction:column;justify-content:center;position:relative}
.ws.on{border-color:var(--y)}.ws.empty{opacity:.5}
.ws .wn{font-weight:800}.ws .wa b{font-size:14px;color:var(--y)}
.ws .wsg{position:absolute;right:5px;top:3px;font-size:9px;opacity:.75}
.hb{position:absolute;border-radius:50%;background:rgba(10,14,34,.42);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-align:center;line-height:1}
.hb:active,.hb.on{background:rgba(255,210,63,.45);border-color:var(--y)}
.hb b{font-size:9px;letter-spacing:.3px}
.fireR{width:84px;height:84px;right:calc(26px + var(--sr));bottom:70px}
.fireL{width:58px;height:58px;left:calc(26px + var(--sl));top:44%}
.ic-fire{width:44%;height:44%;border-radius:50%;background:radial-gradient(circle,#fff 30%,transparent 32%),conic-gradient(#fff 0 0);-webkit-mask:radial-gradient(circle,#000 28%,transparent 30%,transparent 46%,#000 48%,#000 60%,transparent 62%);mask:radial-gradient(circle,#000 28%,transparent 30%,transparent 46%,#000 48%,#000 60%,transparent 62%)}
.ads{width:56px;height:56px;right:calc(126px + var(--sr));bottom:150px}
.ic-ads{width:46%;height:46%;border:3px solid #fff;border-radius:50%;position:relative}
.ic-ads:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:var(--r);border-radius:50%}
.jump{width:50px;height:50px;right:calc(120px + var(--sr));bottom:90px;font-size:22px}
.crouch{width:52px;height:52px;right:calc(124px + var(--sr));bottom:22px}
.prone{width:50px;height:50px;right:calc(43px + var(--sr));bottom:8px;border-radius:14px}
.reload{width:44px;height:44px;right:calc(28px + var(--sr));bottom:166px;font-size:20px}
.leanL,.leanR{width:44px;height:44px;top:44%;font-size:17px}
.leanL{left:calc(96px + var(--sl))}.leanR{left:calc(146px + var(--sl))}
.bag{width:40px;height:38px;right:calc(52px + var(--sr));top:6px;font-size:18px;border-radius:12px}
.heal{width:46px;height:46px;left:calc(50% - 205px);bottom:26px;font-size:20px;color:#7dff9c}
.view{width:38px;height:38px;right:calc(98px + var(--sr));top:6px;font-size:12px;border-radius:12px}
.menu{width:38px;height:38px;right:calc(8px + var(--sr));top:6px;font-size:18px;border-radius:12px}
.act{right:calc(26px + var(--sr));bottom:240px;width:auto!important;min-width:110px;height:42px;padding:0 14px;border-radius:12px;background:linear-gradient(180deg,#ffe45c,#ffb703);color:#2a1a00;font-size:14px;border:0;box-shadow:0 3px 0 #b37400}
#vehI{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--bg);padding:4px 12px;border-radius:10px;font-size:12px;text-align:center;pointer-events:none;min-width:150px}
#vehI b{font-size:20px;color:var(--y)}.vb{height:4px;background:rgba(0,0,0,.5);border-radius:2px;margin-top:3px;overflow:hidden}.vb i{display:block;height:100%;background:#7dff9c}
.seat{width:46px;height:46px;right:calc(150px + var(--sr));bottom:240px;font-size:20px;border-radius:12px}
.drv{border-radius:16px;font-size:30px}
.drvL{width:86px;height:78px;left:calc(24px + var(--sl));bottom:28px}.drvR{width:86px;height:78px;left:calc(122px + var(--sl));bottom:28px}
.gas{width:96px;height:96px;right:calc(26px + var(--sr));bottom:40px;border-radius:50%;font-size:11px;background:rgba(40,140,60,.45)}
.brake{width:78px;height:64px;right:calc(134px + var(--sr));bottom:30px;font-size:10px;background:rgba(170,40,40,.42)}
.thr{width:50px;height:50px;right:calc(196px + var(--sr));bottom:120px;font-size:22px;flex-direction:column}.thr small{font-size:10px}
.thrS{width:30px;height:30px;right:calc(178px + var(--sr));bottom:166px;font-size:13px}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,14,34,.25);left:calc(60px + var(--sl));bottom:30px;pointer-events:none;opacity:.6}
#joy.on{opacity:1}
#joyK{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#pick{position:absolute;right:calc(196px + var(--sr));top:84px;display:flex;flex-direction:column;gap:3px;max-height:46vh;overflow:hidden;width:190px}
.pk{background:rgba(10,14,34,.66);border-left:3px solid var(--y);padding:6px 8px;border-radius:6px;font-size:12px}
.pk small{opacity:.7}
#healL{position:absolute;left:calc(50% - 205px);bottom:80px;display:flex;flex-direction:column;gap:3px}
.hi{background:rgba(10,14,34,.8);padding:7px 10px;border-radius:8px;font-size:12px;white-space:nowrap}.hi b{color:var(--y)}.hi.off{opacity:.45}
#prog{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:200px;text-align:center;font-size:12px}
#prog div{height:6px;background:rgba(0,0,0,.5);border-radius:3px;margin-top:3px;overflow:hidden}#prog i{display:block;height:100%;background:var(--y)}
#planeT{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:15px;background:var(--bg);padding:10px 16px;border-radius:12px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0;--g:6px}
#cross:before,#cross:after,#cross i:before,#cross i:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{width:2px;height:8px;left:-1px;top:calc(-8px - var(--g))}#cross:after{width:2px;height:8px;left:-1px;top:var(--g)}
#cross i:before{height:2px;width:8px;top:-1px;left:calc(-8px - var(--g))}#cross i:after{height:2px;width:8px;top:-1px;left:var(--g)}
#cross.dot:before,#cross.dot:after,#cross.dot i:before,#cross.dot i:after{display:none}
#cross.dot i{position:absolute;width:5px;height:5px;left:-2.5px;top:-2.5px;border-radius:50%;background:#ff2d55;box-shadow:0 0 4px #ff2d55}
#scope{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent min(42vh,42vw),#000 calc(min(42vh,42vw) + 2px))}
#scope:before{content:'';position:absolute;left:50%;top:8%;bottom:8%;width:1.5px;background:#111;transform:translateX(-50%)}
#scope:after{content:attr(data-z);position:absolute;left:50%;top:50%;width:min(84vh,84vw);height:1.5px;background:linear-gradient(90deg,#111 44%,transparent 44%,transparent 56%,#111 56%);transform:translate(-50%,-50%);font-size:12px;color:#ff3b3b;text-indent:9999px}
#scope i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#ff2d2d;border-radius:50%}
#scope u{position:absolute;left:50%;top:calc(50% + 20px);transform:translateX(-50%);width:1px;height:calc(min(42vh,42vw) - 30px);background:repeating-linear-gradient(#111 0 1px,transparent 1px 24px)}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0}
#hitm.show{opacity:1}
#hitm:before,#hitm:after{content:'';position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff;transform:rotate(45deg);-webkit-mask:linear-gradient(#000 35%,transparent 35%,transparent 65%,#000 65%);mask:linear-gradient(#000 35%,transparent 35%,transparent 65%,#000 65%)}
#hitm:after{transform:rotate(-45deg)}
#hitm.head:before,#hitm.head:after{background:#ffd23f}#hitm.kill:before,#hitm.kill:after{background:#ff2d55;width:3px}
#hurt{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(255,0,30,.7));opacity:0;transition:opacity .25s}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 60% 70%,rgba(255,220,120,.6),transparent 40%);opacity:0}
.dmgdir{position:absolute;left:50%;top:50%;width:230px;height:230px;border-radius:50%;border:5px solid transparent;border-top-color:rgba(255,40,60,.85);animation:fade .9s forwards}
@keyframes fade{to{opacity:0}}
/* ---------- painéis ---------- */
.panel{position:fixed;inset:0;z-index:20;background:rgba(8,10,26,.94)}
#bagP{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:10px;padding:12px calc(12px + var(--sr)) 12px calc(12px + var(--sl))}
#bagP>div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;overflow-y:auto;touch-action:pan-y}
#bagP h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--y);margin:4px 2px 6px}
#bagP h4 small{color:#fff;opacity:.7}
.li{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(255,255,255,.07);padding:7px 8px;border-radius:8px;margin-bottom:4px;font-size:12px}
.li.off{opacity:.5}.li small{opacity:.7}
.li button,.wt button{background:rgba(255,255,255,.15);border-radius:6px;padding:4px 7px;font-size:11px;margin-left:3px}
.wcard{background:rgba(255,255,255,.07);border-radius:10px;padding:7px;margin-bottom:6px;font-size:12px}

.wt{display:flex;align-items:center;gap:6px}.wt small{opacity:.7;flex:1}
.atts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

.at.on{border:1px solid var(--y);opacity:1;color:var(--y)}
.gear{display:flex;flex-direction:column;gap:4px;font-size:12px;margin-top:6px}.gear .off{opacity:.5}
#bagX{position:fixed;top:8px;right:calc(10px + var(--sr));width:38px;height:38px;border-radius:50%;background:var(--r);font-weight:900;font-size:18px;z-index:21}
#mapP{display:flex;align-items:center;justify-content:center}

#chrP input{background:#0f0f14;color:#fff;border:1px solid #444;border-radius:10px;padding:9px 10px}

#frP input{flex:1;background:#0f1430;color:#fff;border:1px solid #445;border-radius:10px;padding:9px 10px;text-transform:uppercase}
.mycode{font-size:14px}.mycode b{color:var(--y);font-size:18px;letter-spacing:2px}
.flist{overflow-y:auto;touch-action:pan-y;max-height:42vh;display:flex;flex-direction:column;gap:4px}
.fi{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.07);padding:7px 10px;border-radius:8px;font-size:13px}

.lon{position:absolute;left:calc(16px + var(--sl));bottom:14px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.slot.fr{border:2px solid var(--b);justify-content:center;font-weight:800}.slot small{font-size:10px;opacity:.7;font-weight:400}

.btn.big{font-size:18px;padding:12px 26px}
